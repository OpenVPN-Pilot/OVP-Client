name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    # The application targets Windows and its platform layer speaks to the Windows shell directly,
    # so there is nothing meaningful a build on another system would prove.
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test
        run: dotnet test --no-build --configuration Release --verbosity normal

      - name: Publish the application
        run: >
          dotnet publish src/OpenVpnPilot.App
          --configuration Release
          --runtime win-x64
          --self-contained false
          --output artifacts/app

      - name: Publish the command
        run: >
          dotnet publish src/OpenVpnPilot.Cli
          --configuration Release
          --runtime win-x64
          --self-contained false
          --output artifacts/cli

      - name: Pack the command as a global tool
        run: dotnet pack src/OpenVpnPilot.Cli --configuration Release

      - name: Upload the build output
        uses: actions/upload-artifact@v4
        with:
          name: openvpnpilot-${{ github.sha }}
          path: |
            artifacts/app
            artifacts/cli
            artifacts/packages
          retention-days: 14

  release:
    # Only a tag produces a release. A build of the default branch is a check, not a shipment.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: windows-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish the application
        run: >
          dotnet publish src/OpenVpnPilot.App
          --configuration Release
          --runtime win-x64
          --self-contained false
          --output artifacts/app

      - name: Publish the command
        run: >
          dotnet publish src/OpenVpnPilot.Cli
          --configuration Release
          --runtime win-x64
          --self-contained false
          --output artifacts/cli

      - name: Pack the command as a global tool
        run: dotnet pack src/OpenVpnPilot.Cli --configuration Release

      - name: Assemble the portable archive
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts/release | Out-Null
          Compress-Archive -Path artifacts/app/* -DestinationPath artifacts/release/OpenVpnPilot-${{ github.ref_name }}-win-x64.zip
          Compress-Archive -Path artifacts/cli/* -DestinationPath artifacts/release/ovp-${{ github.ref_name }}-win-x64.zip

      - name: Create the release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            artifacts/release/*.zip
            artifacts/packages/*.nupkg
